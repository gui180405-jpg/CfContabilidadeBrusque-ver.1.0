<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin | CF Contabilidade</title>

    <script>
      window.CMS_MANUAL_INIT = true;
    </script>
  </head>

  <body>
    <div id="loading" style="font-family: Arial, sans-serif; padding: 24px;">
      Carregando painel da CF Contabilidade...
    </div>

    <script src="https://unpkg.com/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <script src="https://unpkg.com/decap-cms@3.8.3/dist/decap-cms.js"></script>

    <script>
      function finishLoginFromSessionStorage() {
        var token = sessionStorage.getItem('decap_oauth_token');
        var provider = sessionStorage.getItem('decap_oauth_provider') || 'github';

        if (!token) return;

        sessionStorage.removeItem('decap_oauth_token');
        sessionStorage.removeItem('decap_oauth_provider');

        var payload =
          'authorization:' +
          provider +
          ':success:' +
          JSON.stringify({
            token: token,
            provider: provider,
          });

        function sendPayload() {
          window.postMessage('authorizing:' + provider, window.location.origin);
          window.postMessage(payload, window.location.origin);

          window.dispatchEvent(
            new MessageEvent('message', {
              data: payload,
              origin: window.location.origin,
              source: window,
            })
          );
        }

        // O Decap precisa carregar antes de receber a mensagem.
        setTimeout(sendPayload, 500);
        setTimeout(sendPayload, 1200);
        setTimeout(sendPayload, 2500);
      }

      async function startCMS() {
        try {
          const response = await fetch('/admin/config.yml?v=' + Date.now(), {
            cache: 'no-store',
            headers: {
              'Cache-Control': 'no-cache',
            },
          });

          if (!response.ok) {
            throw new Error('Não foi possível carregar /admin/config.yml. Status: ' + response.status);
          }

          const yamlText = await response.text();
          const config = jsyaml.load(yamlText);

          if (!config || !config.backend || !config.media_folder || !config.collections) {
            console.error('Config carregado:', config);
            throw new Error('O config.yml foi carregado, mas está incompleto.');
          }

          document.getElementById('loading').remove();

          CMS.init({
            config,
          });

          finishLoginFromSessionStorage();
        } catch (error) {
          console.error(error);

          document.getElementById('loading').innerHTML = `
            <h1>Erro ao carregar o painel</h1>
            <p>O arquivo <strong>/admin/config.yml</strong> não foi carregado corretamente.</p>
            <pre style="white-space: pre-wrap; background: #f1f5f9; padding: 16px; border-radius: 12px;">${error.message}</pre>
          `;
        }
      }

      startCMS();
    </script>
  </body>
</html>
