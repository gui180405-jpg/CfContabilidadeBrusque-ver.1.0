backend:
  name: github
  repo: gui180405-jpg/CfContabilidadeBrusque-ver.1.0
  branch: main

site_url: https://cf-contabilidade-brusque-ver-1-0.vercel.app
display_url: https://cf-contabilidade-brusque-ver-1-0.vercel.app
logo_url: /logo-cf-azul.png

media_folder: public/blog
public_folder: /blog

locale: pt

collections:
  - name: cf_blog_posts
    label: Blog e Notícias
    label_singular: Post
    folder: src/content/posts
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}} — {{category}}"
    editor:
      preview: true
    fields:
      - label: Título
        name: title
        widget: string
        required: true

      - label: Jornada do conteúdo
        name: category
        widget: select
        required: true
        hint: Escolha o momento ou tipo de dúvida que este conteúdo ajuda a resolver.
        options:
          - Começando a empresa
          - Rotina contábil
          - Impostos e enquadramento
          - Trabalhista e equipe
          - Gestão financeira
          - Regularização e pendências
          - Guias por segmento
          - Notícias e prazos

      - label: Tipo de conteúdo
        name: type
        widget: select
        required: true
        options:
          - Artigo
          - Notícia
          - Alerta
          - Guia
          - Orientação
          - Prazo

      - label: Data
        name: date
        widget: datetime
        required: true
        format: YYYY-MM-DD
        date_format: DD/MM/YYYY
        time_format: false

      - label: Tempo de leitura
        name: readTime
        widget: string
        required: false
        default: 4 min de leitura

      - label: Resumo
        name: excerpt
        widget: text
        required: true
        hint: Texto curto que aparece no card do blog.

      - label: Imagem
        name: image
        widget: image
        required: false
        hint: Opcional. Se não enviar imagem, o site usa um card padrão.

      - label: Link externo
        name: link
        widget: string
        required: false
        default: "#"
        hint: Use # para abrir a página interna do artigo. Use uma URL completa apenas quando for link externo.

      - label: Post em destaque
        name: featured
        widget: boolean
        required: false
        default: false

      - label: Publicado
        name: published
        widget: boolean
        required: false
        default: true

      - label: Rascunho / Em breve
        name: draft
        widget: boolean
        required: false
        default: false

      - label: Conteúdo completo
        name: body
        widget: markdown
        required: false
