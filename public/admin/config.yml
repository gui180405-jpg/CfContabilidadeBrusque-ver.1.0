# ============================================================
# DECAP CMS — CF CONTABILIDADE BRUSQUE
# ============================================================
# Este arquivo configura o painel /admin.
# Branch configurada: main
#
# IMPORTANTE:
# Para publicar no GitHub/Vercel, troque a linha repo abaixo:
# repo: SEU_USUARIO_OU_ORG/NOME_DO_REPOSITORIO
#
# Exemplo:
# repo: gui180405-jpg/CfContabilidadeBrusque-ver.1.0
# ============================================================

local_backend: true

backend:
  name: github
  repo: SEU_USUARIO_OU_ORG/NOME_DO_REPOSITORIO
  branch: main

# As imagens enviadas pelo painel serão salvas em public/blog
# e chamadas no site como /blog/nome-da-imagem.jpg
media_folder: "public/blog"
public_folder: "/blog"

locale: "pt"

collections:
  - name: "posts"
    label: "Blog e Notícias"
    label_singular: "Post ou notícia"
    folder: "src/content/posts"
    create: true
    delete: true
    extension: "md"
    format: "frontmatter"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} — {{category}}"
    editor:
      preview: false

    fields:
      - label: "Título"
        name: "title"
        widget: "string"
        hint: "Título principal que aparece no card e no destaque."

      - label: "Categoria"
        name: "category"
        widget: "select"
        default: "Notícias"
        options:
          - "Notícias"
          - "Impostos"
          - "Simples Nacional"
          - "Trabalhista"
          - "Abertura de empresa"
          - "Gestão financeira"
          - "Regularização"
          - "Obrigações mensais"

      - label: "Tipo de conteúdo"
        name: "type"
        widget: "select"
        default: "Artigo"
        options:
          - "Artigo"
          - "Notícia"
          - "Alerta"
          - "Guia"
          - "Orientação"
          - "Prazo"

      - label: "Data"
        name: "date"
        widget: "datetime"
        date_format: "DD/MM/YYYY"
        time_format: false
        format: "YYYY-MM-DD"
        default: "{{now}}"

      - label: "Tempo de leitura"
        name: "readTime"
        widget: "string"
        default: "3 min de leitura"

      - label: "Resumo"
        name: "excerpt"
        widget: "text"
        hint: "Resumo curto que aparece no card do blog."

      - label: "Imagem do post"
        name: "image"
        widget: "image"
        required: false
        hint: "Opcional. Se não colocar imagem, o site usa um card padrão bonito."

      - label: "Link externo ou interno"
        name: "link"
        widget: "string"
        required: false
        default: "#"
        hint: "Use # para conteúdo em breve, ou coloque um link externo/notícia."

      - label: "Post em destaque"
        name: "featured"
        widget: "boolean"
        default: false
        hint: "Marque apenas um post como destaque principal."

      - label: "Publicado"
        name: "published"
        widget: "boolean"
        default: true
        hint: "Se desligar, o post não aparece no site."

      - label: "Rascunho / Em breve"
        name: "draft"
        widget: "boolean"
        default: true
        hint: "Quando ligado, aparece como Em breve se o link estiver #."

      - label: "Conteúdo completo"
        name: "body"
        widget: "markdown"
        required: false
        hint: "Aqui você pode escrever o texto completo do post para uso futuro."
