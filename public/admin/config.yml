backend:
  name: github
  repo: gui180405-jpg/CfContabilidadeBrusque-ver.1.0
  branch: main
  base_url: https://cf-contabilidade-brusque-ver-1-0.vercel.app/api
  auth_endpoint: auth

site_url: https://cf-contabilidade-brusque-ver-1-0.vercel.app
display_url: https://cf-contabilidade-brusque-ver-1-0.vercel.app

media_folder: public/blog
public_folder: /blog

collections:
  - name: posts
    label: Blog e Notícias
    label_singular: Post
    folder: src/content/posts
    create: true
    extension: md
    format: frontmatter
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} — {{category}}"
    fields:
      - label: Título
        name: title
        widget: string

      - label: Categoria
        name: category
        widget: select
        options:
          - Notícias
          - Impostos
          - Simples Nacional
          - Trabalhista
          - Abertura de empresa
          - Gestão financeira
          - Regularização
          - Obrigações mensais

      - label: Tipo de conteúdo
        name: type
        widget: select
        options:
          - Artigo
          - Notícia
          - Alerta
          - Guia
          - Orientação
          - Prazo

      - label: Data
        name: date
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD

      - label: Tempo de leitura
        name: readTime
        widget: string
        default: 3 min de leitura

      - label: Resumo
        name: excerpt
        widget: text

      - label: Imagem
        name: image
        widget: image
        required: false

      - label: Link externo ou interno
        name: link
        widget: string
        required: false
        default: "#"
        hint: "Use # para conteúdo em breve, ou cole uma URL completa para notícia externa."

      - label: Post em destaque
        name: featured
        widget: boolean
        default: false
        required: false

      - label: Publicado
        name: published
        widget: boolean
        default: true

      - label: Rascunho / Em breve
        name: draft
        widget: boolean
        default: false
        required: false

      - label: Conteúdo completo
        name: body
        widget: markdown
        required: false
